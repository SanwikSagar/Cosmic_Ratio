<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | AstroidDestroyer (Fixed Resolution)</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap');
      
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
          background: #000; font-family: 'Roboto', sans-serif;
          overflow: hidden; width: 100%; height: 100%;
      }
      #page-container {
          width: 100vw; height: 100vh; display: flex; flex-direction: column;
          background: linear-gradient(135deg, #3a4374 0%, #232942 100%);
      }
      #controls {
          background: linear-gradient(135deg, rgba(26, 26, 26, 0.95) 0%, rgba(42, 42, 42, 0.95) 100%);
          padding: 12px 25px; display: flex; justify-content: space-between; align-items: center;
          box-shadow: 0 4px 20px rgba(0,0,0,0.5); border-bottom: 2px solid rgba(102, 126, 234, 0.5);
          backdrop-filter: blur(10px); z-index: 10; flex-shrink: 0;
      }
      .title-section { display: flex; align-items: center; gap: 15px; }
      .game-logo {
          width: 35px; height: 35px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          border-radius: 8px; display: flex; align-items: center; justify-content: center;
          font-size: 22px; color: white; box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
      }
      .game-title {
          color: white; font-family: 'Bebas Neue', cursive; font-size: 28px;
          letter-spacing: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      }
      .btn-group { display: flex; gap: 15px; align-items: center; }
      button {
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer;
          font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
          transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
          display: flex; align-items: center;
      }
      button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6); }
      .btn-secondary {
          background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3);
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }
      .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
      .icon { font-size: 16px; margin-right: 8px; }
      #unity-container {
        flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; position: relative;
      }
      #unity-canvas { background: #000; }
      #page-container:fullscreen #controls { display: none; }
      #loading-overlay {
          position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8);
          color: white; display: flex; justify-content: center; align-items: center;
          font-family: Arial, sans-serif; font-size: 2em; z-index: 99;
      }
      #debug-overlay {
          position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: #00ff00;
          padding: 10px; border: 1px solid #00ff00; font-family: monospace; font-size: 12px;
          line-height: 1.4; z-index: 100; pointer-events: none; border-radius: 5px; max-width: 90%;
      }
    </style>
  </head>
  <body>
    <div id="page-container">
      <div id="controls">
          <div class="title-section">
              <div class="game-logo">🚀</div>
              <h1 class="game-title">AstroidDestroyer</h1>
          </div>
          <div class="btn-group">
              <button id="fullscreen-button" onclick="toggleFullscreen()">
                  <span class="icon">⛶</span><span>Fullscreen</span>
              </button>
              <button class="btn-secondary" onclick="restartGame()">
                  <span class="icon">🔄</span><span>Restart</span>
              </button>
          </div>
      </div>

      <div id="unity-container">
        <!-- The script now sets the internal width and height dynamically -->
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="debug-overlay">Initializing Debugger...</div>
      </div>
    </div>

    <div id="loading-overlay">
      <div id="loading-text">Loading... 0%</div>
    </div>
    
    <script>
      // --- ELEMENT SELECTORS ---
      var pageContainer = document.querySelector("#page-container");
      var unityContainer = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingOverlay = document.querySelector("#loading-overlay");
      var loadingText = document.querySelector("#loading-text");
      var debugOverlay = document.querySelector("#debug-overlay");

      function updateDebugOverlay(data) {
        let html = `<strong>== REAL-TIME DEBUGGER ==</strong><br>`;
        for (const key in data) { html += `<strong>${key}:</strong> ${data[key]}<br>`; }
        debugOverlay.innerHTML = html;
      }
      
      function toggleFullscreen() {
          if (!document.fullscreenElement) {
              pageContainer.requestFullscreen().catch(err => { alert(`Error: ${err.message}`); });
          } else { document.exitFullscreen(); }
      }

      function restartGame() { location.reload(); }

      // --- [FIXED RESOLUTION] SCALING AND LETTERBOXING LOGIC ---
      function applyLetterboxing(source = 'Unknown') {
          console.log(`%c--- applyLetterboxing triggered by: ${source} ---`, 'color: cyan; font-weight: bold;');
          const debugData = { trigger: source };

          // 1. Determine Target Aspect Ratio and FIXED Resolution
          const isPortrait = window.innerHeight > window.innerWidth;
          const targetAspectRatio = isPortrait ? (9 / 16) : (16 / 9);
          const targetInternalRes = isPortrait ? "1080x1920" : "1920x1080";
          
          debugData.orientation = isPortrait ? 'Portrait' : 'Landscape';
          debugData.targetInternalRes = targetInternalRes;

          // 2. Calculate new CSS size for display (scaling)
          let containerWidth = unityContainer.offsetWidth;
          let containerHeight = unityContainer.offsetHeight;
          let containerAspectRatio = containerWidth / containerHeight;
          debugData.containerSize = `${containerWidth}x${containerHeight}`;
          
          let newWidth, newHeight;
          if (containerAspectRatio > targetAspectRatio) {
              newHeight = containerHeight;
              newWidth = newHeight * targetAspectRatio;
          } else {
              newWidth = containerWidth;
              newHeight = newWidth / targetAspectRatio;
          }
          debugData.calculatedCssSize = `${Math.round(newWidth)}x${Math.round(newHeight)}`;

          // 3. Apply CSS size for display
          canvas.style.width = newWidth + 'px';
          canvas.style.height = newHeight + 'px';

          // 4. [THE CRITICAL FIX] Manually set the internal resolution to the FIXED target values.
          // This decouples rendering resolution from screen size.
          if (isPortrait) {
              canvas.width = 1080;
              canvas.height = 1920;
          } else {
              canvas.width = 1920;
              canvas.height = 1080;
          }
          console.log(`%cDEBUG: Forcing canvas INTERNAL resolution to fixed size: ${canvas.width}w x ${canvas.height}h`, 'color: lime; font-weight: bold;');

          // 5. Update Debugger
          debugData.finalCssSize = `${canvas.style.width} x ${canvas.style.height}`;
          debugData.finalInternalRes = `${canvas.width}x${canvas.height}`;
          updateDebugOverlay(debugData);
          console.log('%c----------------------------------------------------', 'color: cyan;');
      }

      // --- EVENT LISTENERS ---
      window.addEventListener('resize', () => applyLetterboxing('Window Resize'));
      window.addEventListener('orientationchange', () => applyLetterboxing('Orientation Change'));
      
      document.addEventListener('fullscreenchange', () => {
          const isFullscreen = !!document.fullscreenElement;
          const fullscreenButton = document.getElementById('fullscreen-button');
          if (isFullscreen) {
              fullscreenButton.innerHTML = '<span class="icon">❎</span><span>Exit</span>';
          } else {
              fullscreenButton.innerHTML = '<span class="icon">⛶</span><span>Fullscreen</span>';
          }
          setTimeout(() => applyLetterboxing('Fullscreen Change'), 150); 
      });

      // --- UNITY CONFIG [UNCHANGED AND CORRECT] ---
      function unityShowBanner(msg, type) { /* ... */ }
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Asteroid_destroyer.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Asteroid_destroyer.data",
        frameworkUrl: buildUrl + "/Asteroid_destroyer.framework.js",
        codeUrl: buildUrl + "/Asteroid_destroyer.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "AstroidDestroyer",
        productVersion: "1.1",
        showBanner: unityShowBanner,
      };

      // --- LOADER SCRIPT [UNCHANGED] ---
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          loadingText.innerHTML = `Loading... ${Math.round(progress * 100)}%`;
        }).then((unityInstance) => {
          loadingOverlay.style.display = 'none';
        }).catch((message) => { alert(message); });
      };
      
      // --- INITIALIZATION ---
      applyLetterboxing('Initial Load'); 
      document.body.appendChild(script);
    </script>
  </body>
</html>
